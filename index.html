<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapas de los mundos literarios de Robert Fader · Sinea</title>
<meta name="description" content="Mapas de los mundos literarios de Robert Fader: Sinea, Verdegrad, Nuestra Utopía y Mendoza en 3D, con los lugares de las novelas, en qué capítulo aparece cada uno y reseñas de los personajes. Карты миров Роберта Фадера.">
<meta name="theme-color" content="#1d2a38">
<link rel="icon" href="img/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/sinea.css">
<script>globalThis.CIUDAD = (c => ['verdegrad', 'utopia', 'mendoza', 'venezia', 'madrid'].includes(c) ? c : 'sinea')(new URLSearchParams(location.search).get('ciudad'));</script>
</head>
<body>
<canvas id="mapa"></canvas>
<div id="etiquetas" aria-hidden="false"></div>

<header id="barra">
  <div class="caja-busqueda">
    <svg class="lupa" viewBox="0 0 24 24"><path d="M10 3a7 7 0 015.6 11.2l5 5-1.4 1.4-5-5A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg>
    <input id="buscar" type="search" placeholder="Buscar en Sinea: un lugar, una novela, un personaje…" autocomplete="off" aria-label="Buscar en Sinea">
    <div id="resultados" hidden></div>
  </div>
  <select id="novela" aria-label="Filtrar por novela"></select>
  <div id="ciudad" role="group" aria-label="Ciudad / Город"><button data-c="sinea" data-es="Sinea" data-ru="Синея">Sinea</button><button data-c="verdegrad" data-es="Verdegrad" data-ru="Вердеград">Verdegrad</button><button data-c="utopia" data-es="Utopía" data-ru="Утопия">Utopía</button><button data-c="mendoza" data-es="Mendoza" data-ru="Мендоса">Mendoza</button><button data-c="venezia" data-es="Venecia" data-ru="Венеция">Venecia</button><button data-c="madrid" data-es="Madrid" data-ru="Мадрид">Madrid</button></div>
  <div id="idioma" role="group" aria-label="Idioma / Язык"><button data-l="es" title="Español">ES</button><button data-l="ru" title="Русский">RU</button></div>
</header>

<div id="recorrido" hidden><b>Recorrido:</b> <span></span> <button title="Quitar filtro">✕</button></div>

<aside id="panel" aria-live="polite">
  <button class="cerrar" title="Cerrar">✕</button>
  <div class="cuerpo"></div>
</aside>

<nav id="botones">
  <button id="b-norte" title="Mirar al norte"><svg viewBox="0 0 24 24"><path d="M12 2l4 10h-8z" fill="#d24f3f"/><path d="M12 22l-4-10h8z" fill="#9aa3ad"/></svg></button>
  <button id="b-3d" title="Vista 2D / 3D">2D</button>
  <button id="b-noche" title="Hacer de noche"><svg viewBox="0 0 24 24"><path d="M14.5 2A9 9 0 1022 14.5 7.5 7.5 0 0114.5 2z"/></svg></button>
  <button id="b-casa" title="Ver toda la ciudad"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg></button>
  <div class="zoom"><button id="b-mas" title="Acercar">+</button><button id="b-menos" title="Alejar">−</button></div>
</nav>

<footer id="pie">
  <b>Sinea</b> · la ciudad de las novelas de <a href="https://luisfader.github.io/litmir/" target="_blank" rel="noopener">Robert Fader</a> ·
  <a href="https://luisfader.github.io/faderpedia/" target="_blank" rel="noopener">Faderpedia</a> ·
  <span class="ayuda">arrastrá para moverte · clic derecho o dos dedos para girar · rueda para el zoom</span>
</footer>

<div id="carga">
  <div class="titulo-mapas">Mapas de los mundos literarios de Robert Fader</div>
  <div class="logo">Sinea</div>
  <div class="sub">«una ciudad de nieblas, de silencio y de deseos no dichos»</div>
  <p>Cargando…</p>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
